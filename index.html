<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEE 2027 — Overview</title><link rel="stylesheet" href="style.css?v=4">
</head><body>
<script src="js/common.js?v=4"></script>
<script>
(async function(){
  await Store.load();
  const ch = chapters();
  const total = ch.length;
  const masteredL = ch.filter(c=>c.Status==="Mastered");
  const inprogL = ch.filter(c=>["Theory Started","Theory Done","Practice Started","Practice Done"].includes(c.Status));
  const revisionL = ch.filter(c=>c.Status==="Needs Revision");
  const notstartedL = ch.filter(c=>c.Status==="Not Started");
  const mastered = masteredL.length, inprog = inprogL.length, revision = revisionL.length, notstarted = notstartedL.length;
  const qs = ch.reduce((s,c)=>s+(c["Questions Solved"]||0),0);
  const doneN = ch.filter(c=>c._done).length;
  const pct = Math.round(100*doneN/total);
  const logs = Store.data.daily_log||[];
  const week = logs.filter(l=>dUntil(l.Date)>=-7);
  const hrs7 = week.reduce((s,l)=>s+(l["Hours Studied"]||0),0);
  const mockL = (Store.data.mocks||[]).slice().sort((a,b)=>(b.Date||"").localeCompare(a.Date||""));
  const mocks = mockL.length;
  const qsSubj = {}; ch.forEach(c=>{ qsSubj[c.Subject]=(qsSubj[c.Subject]||0)+(c["Questions Solved"]||0); });
  const isoL = d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const days7 = [...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*86400000));
  const hrsByDay = {}; week.forEach(l=>{ hrsByDay[l.Date]=(hrsByDay[l.Date]||0)+(l["Hours Studied"]||0); });

  const upcoming = ch.filter(c=>!c._done && c["Target Date"])
    .sort((a,b)=>a["Target Date"].localeCompare(b["Target Date"])).slice(0,8);

  shell("index.html", `
  ${pgradDefs()}
  <div class="grid cards">
    ${card(pct+"%","syllabus coverage",pct, covTip(),{ring:true})}
    ${card(mastered+"/"+total,"chapters mastered",100*mastered/total, chTip(masteredL),{ring:true})}
    ${card(inprog,"in progress",100*inprog/total, chTip(inprogL),{ring:true})}
    ${card(revision,"needs revision",100*revision/total, chTip(revisionL),{ring:true,cls:"warn"})}
    ${card(notstarted,"not started",100*notstarted/total, chTip(notstartedL),{ring:true,cls:"warn"})}
    ${card(qs.toLocaleString("en-IN"),"questions solved",Math.min(100,qs/50), qsTip(),{ring:true})}
    ${card(hrs7.toFixed(1)+"h","studied last 7 days",Math.min(100,hrs7/70*100), hrsTip(),{ring:true})}
    ${card(mocks,"mocks taken",Math.min(100,mocks*10), mockTip(),{ring:true})}
  </div>

  <h2 class="sec">Coverage by subject</h2>
  <div class="panel">
    ${subjBars()}
  </div>

  <h2 class="sec">Next up — chapters due soonest</h2>
  <div class="nextup">
    ${upcoming.map(c=>`
      <div class="row ${c._overdue?"overdue":""}" onclick="location.href='chapters.html?focus=${c.id}'" style="cursor:pointer">
        <span class="chip ${c.Subject}">${SUBJ_ICON[c.Subject]||""} ${c.Subject}</span>
        <span class="chip ${c.Weightage}">${c.Weightage}</span>
        <span class="chname">${esc(c.Chapter)}</span>
        <span class="dleft ${c._overdue?"over":""}">${dueLabel(c)}</span>
      </div>`).join("") || '<div class="panel muted">No pending chapters with target dates.</div>'}
  </div>

  <h2 class="sec">Phase plan</h2>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">
    ${phase("Phase 1 · Coverage","Aug 10 – Oct 31","All High+Medium chapters to ≥ Practice Done. ~50 Qs/chapter, part tests from Sep.","2026-08-10","2026-10-31")}
    ${phase("Phase 2 · Application","Nov 1 – Dec 31","Low-weight leftovers by Dec 6 · PYQ marathons · 1→2 full tests/week.","2026-11-01","2026-12-31")}
    ${phase("Phase 3 · Simulation","Jan 1 – Jan 21","Full mock every 2 days (~10) · revision only, zero new theory.","2027-01-01","2027-01-21")}
  </div>`);

  function dueLabel(c){
    if(c._left===null) return "no date";
    if(c._left<0) return `${-c._left}d overdue`;
    if(c._left===0) return "due today";
    return `due ${fmt(c["Target Date"])} · ${c._left}d`;
  }
  function card(num,lbl,p,detail,opts={}){
    const ring = opts.ring ? `<div style="margin-top:10px">${pring(p,{size:"sm",cls:opts.cls||""})}</div>` : "";
    const cardCls = "card"+(detail?" hastip":"")+(opts.cls?" "+opts.cls:"");
    return `<div class="${cardCls}"><div class="num">${num}</div><div class="lbl">${lbl}</div>${ring}<div class="bar"><i style="width:${Math.max(0,Math.min(100,p||0))}%"></i></div>${detail?`<div class="tip"><div class="tipin">${detail}</div></div>`:""}</div>`;
  }
  function subjBars(){
    const byS = {}; ch.forEach(c=>{ (byS[c.Subject]=byS[c.Subject]||[0,0])[0]+=c._done?1:0; byS[c.Subject][1]++; });
    const smap = {Physics:"phys", Chemistry:"chem", Maths:"math"};
    return Object.entries(byS).map(([s,[d,t]])=>{
      const p = Math.round(100*d/t);
      return `<div style="display:flex;align-items:center;gap:14px;padding:8px 0">
        <span style="width:100px;font-size:13px;color:var(--muted)">${SUBJ_ICON[s]||""} ${s}</span>
        <div style="flex:1">${pbar(p,{cls:smap[s]||""})}</div>
        <span style="width:70px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums">${d}/${t} · ${p}%</span>
      </div>`;
    }).join("");
  }
  function chTip(list){
    if(!list.length) return '<div class="muted">None right now</div>';
    return `<div class="tiphead">${list.length} chapter${list.length>1?"s":""}</div>`
      + list.map(c=>`<div class="ti"><span class="chip ${c.Subject}">${SUBJ_ICON[c.Subject]||""} ${esc(c.Chapter)}</span><span class="st">${c.Status}</span></div>`).join("")
      + (list.length>10?`<div class="muted" style="text-align:center;font-size:11px;padding:4px 0 2px">▾ scroll for ${list.length-10} more</div>`:"");
  }
  function covTip(){
    const byS = {}; ch.forEach(c=>{ (byS[c.Subject]=byS[c.Subject]||[0,0])[0]+=c._done?1:0; byS[c.Subject][1]++; });
    const bySt = {}; ch.forEach(c=>{ (bySt[c.Status]=bySt[c.Status]||[]).push(c); });
    const order = ["Mastered","Practice Done","Practice Started","Theory Done","Theory Started","Needs Revision","Not Started"];
    return `<div class="tiphead">${doneN} of ${total} chapters done (Practice Done / Mastered)</div>`
      + Object.entries(byS).map(([s,[d,t]])=>`<div class="ti"><span>${SUBJ_ICON[s]||""} ${s}</span><span class="st">${d}/${t} · ${Math.round(100*d/t)}%</span></div>`).join("")
      + `<div class="tiphead" style="margin-top:10px">All statuses</div>`
      + order.filter(s=>bySt[s]).map(s=>`<div class="ti"><span>${s}</span><span class="st">${bySt[s].length}</span></div>`).join("");
  }
  function qsTip(){
    return `<div class="tiphead">${qs.toLocaleString("en-IN")} questions total</div>`
      + Object.entries(qsSubj).map(([s,n])=>`<div class="ti"><span>${SUBJ_ICON[s]||""} ${s}</span><span class="st">${n.toLocaleString("en-IN")} Qs</span></div>`).join("");
  }
  function hrsTip(){
    return `<div class="tiphead">Last 7 days · ${hrs7.toFixed(1)}h total</div><div class="spark">${days7.map(d=>{
      const h = hrsByDay[isoL(d)]||0;
      return `<i style="height:${Math.max(4,Math.min(100,h/12*100))}%" title="${d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"})}: ${h.toFixed(1)}h"></i>`;
    }).join("")}</div><div class="muted" style="margin-top:6px;font-size:11px">oldest → today · hover a bar for exact hours</div>`;
  }
  function mockTip(){
    if(!mockL.length) return '<div class="muted">No mocks yet</div>';
    return `<div class="tiphead">${mocks} test${mocks>1?"s":""} taken · latest first</div>`
      + mockL.map(m=>`<div class="ti"><span>${esc(m.Test||"Untitled")}<span class="muted"> · ${m.Type||"—"} · ${fmt(m.Date)}</span></span><span class="st">${m.Total??"—"}/300</span></div>`).join("");
  }
  function phase(t,d,desc,s,e){
    const now=new Date(), a=new Date(s), b=new Date(e);
    const p = now<a?0 : now>b?100 : Math.round(100*(now-a)/(b-a));
    const live = now>=a&&now<=b;
    return `<div class="panel"><b>${t}</b> ${live?'<span class="chip High" style="margin-left:6px">ACTIVE</span>':''}
      <div class="muted" style="font-size:12px;margin:4px 0 8px">${d}</div>
      <div style="font-size:13px">${desc}</div>
      <div style="margin-top:12px">${pbar(p,{cls:"thick"})}</div>
      <div class="muted" style="font-size:11px;margin-top:4px">${p}% elapsed</div></div>`;
  }
})();
</script>
</body></html>
